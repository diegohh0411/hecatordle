[package]
name = "word-frequency"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.3"
regex = "1.5"
reqwest = { version = "0.11", features = ["blocking", "json"] }
indicatif = "0.17"
dotenv = "0.15"
lopdf = "0.31"
parquet = { version = "53", default-features = false, features = ["snap"] }
