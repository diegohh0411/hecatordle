    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Hecatordle?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Hecatordle is a free daily word puzzle game where you solve 128 five-letter words at the same time. Each guess applies to all 128 words simultaneously. It's like Wordle, but scaled up to 128 words — the ultimate word puzzle challenge."
          }
        },
        {
          "@type": "Question",
          "name": "How many guesses do you get in Hecatordle?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You get 134 total guesses to solve all 128 five-letter words. Each guess applies to every unsolved word simultaneously, so you need to think strategically about which words help you solve the most grids at once."
          }
        },
        {
          "@type": "Question",
          "name": "How is Hecatordle different from Wordle?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "While Wordle gives you one word to solve in 6 guesses, Hecatordle challenges you to solve 128 words at once with 134 guesses. It's inspired by Sedecordle (16 words) but scaled to 128 words for the ultimate challenge."
          }
        },
        {
          "@type": "Question",
          "name": "Is Hecatordle free to play?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Hecatordle is completely free to play. There is one puzzle per day that resets at midnight UTC."
          }
        },
        {
          "@type": "Question",
          "name": "How do color hints work in Hecatordle?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Green means the letter is in the correct position. Yellow means the letter is in the word but in the wrong position. Gray means the letter is not in that specific word. Each of the 128 grids shows its own independent color feedback."
          }
        },
        {
          "@type": "Question",
          "name": "When does the Hecatordle puzzle reset?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The daily puzzle resets at midnight UTC. Everyone gets the same 128 words each day."
          }
        }
      ]
    }
